services:
  # Frontend Service (Next.js)
  - type: web
    name: frontend-service
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://backend-service.onrender.com/api/v1 # Placeholder URL, Render allows internal networking, or you can use public URL.
      - key: NEXT_PUBLIC_WS_URL
        value: wss://backend-service.onrender.com

  # Backend Service (Java Spring Boot)
  - type: web
    name: backend-service
    env: docker
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        value: jdbc:postgresql://db.dqbuppagnagzwdrtyemp.supabase.co:5432/postgres
      - key: DATABASE_USERNAME
        value: postgres
      - key: DATABASE_PASSWORD
        value: "[112131415161718191]" # Ensure you set the correct password securely
      - key: REDIS_URL
        value: redis://localhost:6379 # To be replaced with a real Redis connection
      - key: JWT_SECRET
        generateValue: true
